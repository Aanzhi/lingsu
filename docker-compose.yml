name: lingsu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kechuang}
      POSTGRES_USER: ${POSTGRES_USER:-kechuang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav-debian:1.4}
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c 'echo > /dev/tcp/127.0.0.1/3310'"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s

  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      DOCUMENT_CONVERTER_URL: http://gotenberg:3000
      FILE_SCAN_REQUIRED: "1"
      CLAMAV_HOST: clamav
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout 120 --access-logfile - --error-logfile -"
    volumes:
      - media_data:/app/media
    ports:
      - "${BACKEND_BIND:-127.0.0.1:8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  celery:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      DOCUMENT_CONVERTER_URL: http://gotenberg:3000
      FILE_SCAN_REQUIRED: "1"
      CLAMAV_HOST: clamav
    command: celery -A config worker --loglevel=INFO
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    volumes:
      - beat_schedule:/tmp
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Gotenberg packages LibreOffice as an HTTP conversion service. Export tasks
  # call DOCUMENT_CONVERTER_URL instead of shelling out in the Django container.
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --api-timeout=60s
      - --chromium-disable-javascript=true

  # 前端由 dev profile 的 docker 容器提供（与 backend 同 docker 网络，代理直连
  # backend:8000，不依赖宿主 18001 端口映射）。默认 `up` 不拉起，需显式
  # `--profile dev`；映射 0.0.0.0:5173 以便宿主 localhost 经 colima 转发访问。
  # 宿主本机访问 http://localhost:5173/，或 colima VM IP http://192.168.64.5:5173/。
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "0.0.0.0:5173:5173"
    profiles: ["dev"]

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${NGINX_BIND:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["production"]

volumes:
  postgres_data:
  redis_data:
  media_data:
  frontend_node_modules:
  clamav_data:
  beat_schedule:
