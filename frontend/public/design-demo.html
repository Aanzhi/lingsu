<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="灵溯全站 UI 重设计可交互 Demo" />
  <title>灵溯 · 全站 UI 重设计 Demo</title>
  <style>
    :root {
      --bg: #f3f4f0;
      --surface: #ffffff;
      --surface-soft: #f8faf7;
      --surface-muted: #eef2ed;
      --line: #dfe5df;
      --line-strong: #cad6cc;
      --text: #1e2d26;
      --text-soft: #526159;
      --text-muted: #829088;
      --brand: #4f6f59;
      --brand-deep: #365440;
      --brand-soft: #e7f0e8;
      --accent: #ad7953;
      --accent-soft: #f5ece5;
      --success: #4d8560;
      --success-soft: #e8f3eb;
      --warning: #a8752f;
      --warning-soft: #faf1df;
      --danger: #a8564d;
      --danger-soft: #f9e9e6;
      --shadow: 0 12px 32px rgba(41, 62, 48, .07);
      --shadow-soft: 0 2px 8px rgba(41, 62, 48, .05);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 40px;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-heading: var(--font-body);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 8% 0%, rgba(224, 235, 226, .62), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(79, 111, 89, .28);
      outline-offset: 2px;
    }
    .theme-a {
      --bg: #f6f1e8;
      --surface: #fffdf8;
      --surface-soft: #fbf7ef;
      --surface-muted: #f3eadc;
      --line: #e7ddce;
      --line-strong: #d8c7b1;
      --text: #302b25;
      --text-soft: #685f55;
      --text-muted: #968a7b;
      --brand: #75674f;
      --brand-deep: #4d4435;
      --brand-soft: #eee8dc;
      --accent: #9b6647;
      --accent-soft: #f5e9df;
      --shadow: 0 14px 36px rgba(90, 68, 42, .08);
      --font-heading: Georgia, "Songti SC", "STSong", serif;
    }
    .theme-c {
      --bg: #f2f5f7;
      --surface: #ffffff;
      --surface-soft: #f7f9fa;
      --surface-muted: #eaf0f2;
      --line: #d9e2e6;
      --line-strong: #c4d1d7;
      --text: #1e2c33;
      --text-soft: #53656d;
      --text-muted: #82939b;
      --brand: #3d6c6a;
      --brand-deep: #285250;
      --brand-soft: #e2efee;
      --accent: #bb7647;
      --accent-soft: #faece1;
      --radius-sm: 6px;
      --radius-md: 9px;
      --radius-lg: 13px;
      --space-4: 14px;
      --space-5: 18px;
      --shadow: 0 5px 16px rgba(35, 64, 74, .08);
    }

    .demo-topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      min-height: 66px;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-5);
      padding: 0 var(--space-7);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(16px);
    }
    .brand-lockup, .top-actions, .tone-switch, .inline-actions, .chip-row, .user-chip {
      display: flex;
      align-items: center;
    }
    .brand-lockup { gap: var(--space-3); min-width: 0; }
    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 10px;
      background: var(--brand-deep);
      color: #fff;
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 700;
    }
    .brand-name { font-family: var(--font-heading); font-size: 17px; font-weight: 700; letter-spacing: .02em; }
    .brand-sub { color: var(--text-muted); font-size: 12px; }
    .status, .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      padding: 3px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text-soft);
      font-size: 12px;
      white-space: nowrap;
    }
    .top-actions { gap: var(--space-4); }
    .tone-switch { gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-soft); }
    .tone-switch button {
      border: 0;
      border-radius: 999px;
      padding: 5px 9px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
    }
    .tone-switch button[aria-selected="true"] { background: var(--surface); color: var(--brand-deep); box-shadow: var(--shadow-soft); }
    .top-link { color: var(--text-soft); font-size: 12px; text-decoration: none; }
    .top-link:hover { color: var(--brand-deep); }

    .demo-body { display: grid; min-height: calc(100vh - 66px); grid-template-columns: 232px minmax(0, 1fr); }
    .side-panel {
      position: sticky;
      top: 66px;
      align-self: start;
      height: calc(100vh - 66px);
      overflow: auto;
      padding: var(--space-6) var(--space-4);
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 68%, transparent);
    }
    .side-label { margin: 0 8px 8px; color: var(--text-muted); font-size: 11px; letter-spacing: .08em; }
    .side-nav { display: grid; gap: 3px; }
    .nav-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 10px 11px;
      background: transparent;
      color: var(--text-soft);
      text-align: left;
      font-size: 13px;
    }
    .nav-item:hover { background: var(--surface-muted); color: var(--brand-deep); }
    .nav-item[aria-current="page"] { background: var(--brand-soft); color: var(--brand-deep); font-weight: 650; }
    .nav-more-label { margin: var(--space-5) 8px 5px; color: var(--text-muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .nav-item-secondary { color: var(--text-muted); font-size: 12px; }
    .nav-icon { display: grid; width: 20px; place-items: center; color: currentColor; font-size: 16px; }

    .main-panel { min-width: 0; padding: var(--space-8) clamp(20px, 4vw, 64px) 72px; }
    .content-limit { width: min(1120px, 100%); margin: 0 auto; }
    .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-5); margin-bottom: var(--space-7); }
    .eyebrow { margin: 0 0 6px; color: var(--brand); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: var(--font-heading); color: var(--text); line-height: 1.25; }
    h1 { margin-bottom: 8px; font-size: clamp(26px, 3vw, 36px); letter-spacing: -.025em; }
    h2 { margin-bottom: 8px; font-size: 20px; letter-spacing: -.015em; }
    h3 { margin-bottom: 5px; font-size: 15px; }
    .page-description { max-width: 650px; margin: 0; color: var(--text-soft); font-size: 14px; }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin: var(--space-7) 0 var(--space-4); }
    .section-head h2 { margin-bottom: 0; }
    .section-note { margin: 4px 0 0; color: var(--text-muted); font-size: 12px; }

    .button {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 8px 13px;
      background: var(--surface);
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: .16s ease;
    }
    .button:hover { border-color: var(--brand); background: var(--surface-soft); color: var(--brand-deep); transform: translateY(-1px); }
    .button.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
    .button.primary:hover { border-color: var(--brand-deep); background: var(--brand-deep); }
    .button.subtle { border-color: transparent; background: transparent; color: var(--brand); }
    .button.subtle:hover { background: var(--brand-soft); }
    .button.danger { border-color: var(--danger-soft); background: var(--danger-soft); color: var(--danger); }
    .button[disabled] { cursor: not-allowed; opacity: .45; transform: none; }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }
    .card-pad { padding: var(--space-6); }
    .hero-grid, .two-col, .three-col, .metric-grid, .chapter-grid, .intent-grid { display: grid; gap: var(--space-4); }
    .hero-grid { grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr); }
    .two-col { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three-col { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .metric-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .chapter-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .intent-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .hero-card { position: relative; overflow: hidden; min-height: 250px; padding: clamp(22px, 4vw, 42px); background: var(--brand-deep); color: #fff; }
    .hero-card::after { position: absolute; right: -42px; bottom: -70px; width: 220px; height: 220px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; box-shadow: 0 0 0 22px rgba(255,255,255,.04), 0 0 0 44px rgba(255,255,255,.025); content: ""; }
    .hero-card h2 { max-width: 510px; margin-bottom: 12px; color: #fff; font-size: clamp(24px, 3vw, 34px); }
    .hero-card p { max-width: 540px; margin-bottom: 24px; color: rgba(255,255,255,.76); }
    .hero-card .button { border-color: rgba(255,255,255,.35); background: #fff; color: var(--brand-deep); }
    .hero-card .button:hover { background: var(--brand-soft); }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 18px; color: rgba(255,255,255,.7); font-size: 12px; }
    .next-card { padding: var(--space-6); }
    .next-card .task-kicker { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 18px; color: var(--text-muted); font-size: 12px; }
    .next-card .task-title { margin-bottom: 7px; font-family: var(--font-heading); font-size: 20px; font-weight: 700; }
    .next-card .task-text { margin-bottom: 20px; color: var(--text-soft); font-size: 13px; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 999px; background: var(--surface-muted); }
    .progress-value { height: 100%; border-radius: inherit; background: var(--brand); }
    .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; color: var(--text-soft); font-size: 12px; }
    .progress-row strong { color: var(--text); }
    .metric { padding: var(--space-5); }
    .metric-label { color: var(--text-muted); font-size: 12px; }
    .metric-value { margin: 5px 0; font-family: var(--font-heading); font-size: 28px; font-weight: 700; }
    .metric-foot { color: var(--text-soft); font-size: 12px; }
    .metric-foot.good { color: var(--success); }
    .metric-foot.warn { color: var(--warning); }
    .chapter-card { min-width: 0; padding: var(--space-4); transition: .16s ease; }
    .chapter-card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
    .chapter-card.current { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    .chapter-index { display: flex; width: 27px; height: 27px; align-items: center; justify-content: center; margin-bottom: 15px; border-radius: 50%; background: var(--surface-muted); color: var(--text-soft); font-size: 12px; font-weight: 700; }
    .chapter-card.done .chapter-index { background: var(--success-soft); color: var(--success); }
    .chapter-card.current .chapter-index { background: var(--brand); color: #fff; }
    .chapter-card h3 { min-height: 38px; }
    .chapter-card p { margin-bottom: 13px; color: var(--text-muted); font-size: 12px; }
    .status { min-height: 22px; padding: 2px 7px; border: 0; background: var(--surface-muted); color: var(--text-soft); font-size: 11px; }
    .status.done { background: var(--success-soft); color: var(--success); }
    .status.active { background: var(--brand-soft); color: var(--brand-deep); }
    .status.pending { background: var(--surface-muted); color: var(--text-muted); }
    .status.warning { background: var(--warning-soft); color: var(--warning); }
    .status.danger { background: var(--danger-soft); color: var(--danger); }
    .list { display: grid; gap: 0; }
    .list-row { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: var(--space-4); padding: 15px 0; border-bottom: 1px solid var(--line); }
    .list-row:first-child { padding-top: 0; }
    .list-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .row-main { min-width: 0; }
    .row-title { overflow: hidden; margin-bottom: 3px; color: var(--text); font-size: 13px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .row-meta { color: var(--text-muted); font-size: 12px; }
    .row-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; }
    .icon-button { display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); }
    .icon-button:hover { border-color: var(--line); background: var(--surface-soft); color: var(--brand-deep); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { padding: 0 12px 12px; color: var(--text-muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
    td { padding: 15px 12px; border-top: 1px solid var(--line); color: var(--text-soft); font-size: 13px; vertical-align: middle; }
    td:first-child, th:first-child { padding-left: 0; }
    td:last-child, th:last-child { padding-right: 0; text-align: right; }
    .person { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .avatar { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: var(--brand-soft); color: var(--brand-deep); font-size: 11px; font-weight: 700; }
    .avatar.orange { background: var(--accent-soft); color: var(--accent); }
    .avatar.blue { background: #e7eef7; color: #50719b; }
    .person-copy { min-width: 0; }
    .person-name { overflow: hidden; color: var(--text); font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .person-meta { color: var(--text-muted); font-size: 11px; }
    .filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-bottom: var(--space-5); }
    .input, .select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      background: var(--surface);
      color: var(--text);
    }
    .input { min-width: 220px; }
    .select { min-width: 130px; }
    .input::placeholder { color: var(--text-muted); }
    .detail-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, .6fr); gap: var(--space-5); }
    .detail-main, .detail-aside { display: grid; align-content: start; gap: var(--space-5); min-width: 0; }
    .summary-line { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; color: var(--text-soft); font-size: 12px; }
    .summary-line strong { color: var(--text); }
    .chapter-accordion { overflow: hidden; }
    .accordion-row { border-bottom: 1px solid var(--line); }
    .accordion-row:last-child { border-bottom: 0; }
    .accordion-head { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; padding: 16px 0; background: transparent; color: var(--text); text-align: left; }
    .accordion-head:hover .accordion-title { color: var(--brand-deep); }
    .accordion-number { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: var(--surface-muted); color: var(--text-soft); font-size: 12px; font-weight: 700; }
    .accordion-row.done .accordion-number { background: var(--success-soft); color: var(--success); }
    .accordion-row.active .accordion-number { background: var(--brand); color: #fff; }
    .accordion-title { flex: 1; font-weight: 650; }
    .accordion-meta { color: var(--text-muted); font-size: 12px; }
    .accordion-chevron { color: var(--text-muted); transition: transform .16s ease; }
    .accordion-row.open .accordion-chevron { transform: rotate(180deg); }
    .accordion-body { display: none; padding: 0 0 16px 42px; }
    .accordion-row.open .accordion-body { display: block; }
    .task-mini { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); color: var(--text-soft); font-size: 12px; }
    .task-mini:first-child { border-top: 0; }
    .task-mini span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr); gap: var(--space-5); }
    .task-editor { min-height: 260px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); padding: var(--space-5); background: var(--surface-soft); color: var(--text-muted); }
    .task-label { margin-bottom: 9px; color: var(--text); font-size: 12px; font-weight: 700; }
    .callout { padding: var(--space-4); border-left: 3px solid var(--brand); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: var(--brand-soft); color: var(--text-soft); font-size: 13px; }
    .callout strong { display: block; margin-bottom: 4px; color: var(--brand-deep); }
    .ai-shell { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: var(--space-5); }
    .ai-simple-layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: var(--space-5); align-items: start; }
    .ai-main-panel { min-width: 0; }
    .ai-context-summary { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-5); margin-top: var(--space-6); padding-bottom: var(--space-5); border-bottom: 1px solid var(--line); }
    .ai-context-summary h2 { margin-bottom: 4px; }
    .ai-context-summary p:last-child { max-width: 620px; margin-bottom: 0; color: var(--text-soft); font-size: 13px; }
    .ai-stepper-simple { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: var(--space-5) 0; }
    .ai-step-simple { display: flex; align-items: center; gap: 7px; color: var(--text-muted); font-size: 11px; }
    .ai-step-simple span { display: grid; width: 24px; height: 24px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: var(--surface-muted); font-weight: 700; }
    .ai-step-simple.active { color: var(--brand-deep); font-weight: 650; }
    .ai-step-simple.active span { background: var(--brand); color: #fff; }
    .ai-guide-card { padding-top: var(--space-4); }
    .ai-guide-card h2 { margin-bottom: 8px; font-size: clamp(22px, 3vw, 29px); }
    .ai-lead { max-width: 650px; margin-bottom: var(--space-5); color: var(--text-soft); font-size: 14px; }
    .ai-prompt-box { display: grid; gap: 5px; padding: var(--space-5); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-soft); }
    .ai-prompt-box strong { color: var(--brand-deep); font-size: 13px; }
    .ai-prompt-box span { color: var(--text-soft); font-size: 13px; }
    .ai-question-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
    .ai-question-row { display: grid; grid-template-columns: minmax(120px, .35fr) minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .ai-question-row span { color: var(--text-muted); font-size: 12px; }
    .ai-question-row strong { color: var(--text-soft); font-size: 13px; font-weight: 500; }
    .ai-choice-list { display: grid; gap: 9px; }
    .ai-choice { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; padding: 14px 15px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); text-align: left; }
    .ai-choice:hover { border-color: var(--brand); background: var(--brand-soft); }
    .ai-choice strong, .ai-choice small { display: block; }
    .ai-choice small { margin-top: 3px; color: var(--text-muted); font-size: 11px; }
    .ai-draft-grid { display: grid; gap: 12px; }
    .ai-scope-card { position: sticky; top: 86px; }
    .ai-scope-card h2 { font-size: 18px; }
    .ai-scope-card ul { display: grid; gap: 10px; margin: var(--space-5) 0; padding-left: 17px; color: var(--text-soft); font-size: 12px; }
    .ai-scope-divider { height: 1px; margin: var(--space-5) 0; background: var(--line); }
    .ai-scope-card > strong { color: var(--brand-deep); font-size: 13px; }
    .ai-note { margin: 8px 0 0; color: var(--text-muted); font-size: 11px; line-height: 1.55; }
    .intent-card { min-height: 150px; padding: var(--space-5); cursor: pointer; transition: .16s ease; }
    .intent-card:hover, .intent-card.selected { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); transform: translateY(-2px); }
    .intent-icon { display: grid; width: 34px; height: 34px; place-items: center; margin-bottom: 18px; border-radius: 10px; background: var(--brand-soft); color: var(--brand-deep); font-size: 18px; }
    .intent-card p { margin-bottom: 0; color: var(--text-muted); font-size: 12px; }

    .stepper { display: flex; align-items: center; margin-bottom: var(--space-6); }
    .step { display: flex; align-items: center; gap: 7px; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
    .step::after { width: clamp(20px, 5vw, 70px); height: 1px; margin: 0 9px; background: var(--line); content: ""; }
    .step:last-child::after { display: none; }
    .step-dot { display: grid; width: 25px; height: 25px; place-items: center; border-radius: 50%; background: var(--surface-muted); color: var(--text-muted); font-size: 11px; font-weight: 700; }
    .step.active { color: var(--brand-deep); font-weight: 650; }
    .step.active .step-dot { background: var(--brand); color: #fff; }
    .draft-box { padding: var(--space-5); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-soft); }
    .draft-box h3 { margin-bottom: 12px; }
    .draft-field { margin-bottom: 12px; }

    .draft-value { padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-soft); font-size: 13px; }
    .ai-history { padding: var(--space-5); }

    .history-row { padding: 11px 0; border-bottom: 1px solid var(--line); }

    .history-title { margin-bottom: 3px; color: var(--text-soft); font-size: 12px; font-weight: 650; }
    .history-meta { color: var(--text-muted); font-size: 11px; }
    .ai-context-switch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: var(--space-5); padding: 5px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-soft); }
    .ai-context-choice { display: grid; gap: 3px; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 12px 13px; background: transparent; color: var(--text-soft); text-align: left; }
    .ai-context-choice:hover { background: var(--surface-muted); }
    .ai-context-choice.selected { border-color: var(--brand); background: var(--surface); color: var(--brand-deep); box-shadow: var(--shadow-soft); }
    .ai-context-choice strong { font-size: 13px; }
    .ai-context-choice small { color: var(--text-muted); font-size: 11px; line-height: 1.45; }
    .ai-boundary { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 var(--space-5); padding: 11px 13px; border-left: 3px solid var(--brand); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: var(--brand-soft); color: var(--text-soft); font-size: 12px; }
    .ai-boundary strong { color: var(--brand-deep); }
    .ai-boundary span { padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.66); color: var(--brand-deep); font-size: 11px; }
    .ai-mode-title { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: 4px; }
    .ai-mode-title h2 { margin-bottom: 0; }
    .ai-mode-title .status { flex: 0 0 auto; }
    .brainstorm-options { display: grid; gap: 9px; margin-top: var(--space-4); }
    .brainstorm-option { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 13px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
    .brainstorm-option.selected { border-color: var(--brand); background: var(--brand-soft); }
    .brainstorm-option strong { display: block; margin-bottom: 3px; color: var(--text); font-size: 13px; }
    .brainstorm-option p { margin: 0; color: var(--text-muted); font-size: 11px; line-height: 1.45; }
    .brainstorm-option button { flex: 0 0 auto; border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 10px; background: var(--surface); color: var(--brand-deep); font-size: 11px; }
    .brainstorm-option.selected button { border-color: var(--brand); background: var(--brand); color: #fff; }
    .review-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(260px, .85fr); gap: var(--space-5); }
    .review-score { display: flex; align-items: center; gap: 16px; padding-bottom: var(--space-5); border-bottom: 1px solid var(--line); }
    .review-score-value { display: grid; width: 66px; height: 66px; place-items: center; border: 5px solid var(--brand-soft); border-right-color: var(--warning); border-radius: 50%; color: var(--brand-deep); font-family: var(--font-heading); font-size: 19px; font-weight: 700; }
    .review-score-copy strong { display: block; margin-bottom: 3px; }
    .review-score-copy span { color: var(--text-muted); font-size: 12px; }
    .review-finding { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .review-finding:last-child { border-bottom: 0; padding-bottom: 0; }
    .finding-mark { display: grid; width: 22px; height: 22px; place-items: center; border-radius: 50%; background: var(--surface-muted); color: var(--text-muted); font-size: 11px; font-weight: 700; }
    .finding-mark.done { background: var(--success-soft); color: var(--success); }
    .finding-mark.warning { background: var(--warning-soft); color: var(--warning); }
    .review-finding strong { display: block; margin-bottom: 3px; font-size: 13px; }
    .review-finding p { margin: 0; color: var(--text-soft); font-size: 12px; line-height: 1.5; }
    .review-finding .status { align-self: start; }
    .review-disclaimer { margin-top: var(--space-4); color: var(--text-muted); font-size: 11px; line-height: 1.5; }
    .empty { padding: 32px; text-align: center; color: var(--text-muted); }
    .empty-mark { display: grid; width: 42px; height: 42px; place-items: center; margin: 0 auto 12px; border-radius: 50%; background: var(--surface-muted); color: var(--brand); font-size: 18px; }
    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 50;
      max-width: min(360px, calc(100vw - 44px));
      transform: translateY(18px);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 15px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: var(--text-soft);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .stack { display: grid; gap: var(--space-4); }
    .muted { color: var(--text-muted); }
    .text-right { text-align: right; }
    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
    @media (max-width: 1080px) {
      .chapter-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 860px) {
      .demo-topbar { padding: 0 var(--space-5); }
      .demo-body { display: block; }

      .side-label { display: none; }
      .side-nav { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
      .nav-item { width: auto; flex: 0 0 auto; white-space: nowrap; }
      .main-panel { padding: var(--space-6) var(--space-5) 60px; }
      .ai-shell, .ai-simple-layout, .detail-layout, .task-layout { grid-template-columns: 1fr; }
      .ai-scope-card { position: static; }
    }
    @media (max-width: 620px) {

      .top-actions { width: 100%; justify-content: space-between; }
      .main-panel { padding: var(--space-5) var(--space-4) 48px; }
      .page-header { align-items: flex-start; flex-direction: column; margin-bottom: var(--space-5); }
      .hero-grid, .two-col, .three-col, .chapter-grid, .intent-grid { grid-template-columns: 1fr; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .metric { padding: 14px; }
      .metric-value { font-size: 23px; }
      .card-pad { padding: var(--space-4); }
      .hero-card { min-height: 0; padding: 24px; }
      .hero-card h2 { font-size: 26px; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .input { min-width: 0; width: 100%; }
      .filter-bar .select { flex: 1; min-width: 0; }
      .list-row { align-items: flex-start; flex-direction: column; gap: 10px; }
      .row-actions { width: 100%; justify-content: flex-end; }
      .stepper { align-items: flex-start; flex-direction: column; gap: 8px; }
      .step::after { display: none; }
      .step { width: 100%; }
      .accordion-body { padding-left: 0; }
      .ai-context-switch { grid-template-columns: 1fr; }
      .ai-mode-title { align-items: flex-start; flex-direction: column; gap: 8px; }
      .ai-context-summary { flex-direction: column; gap: 10px; }
      .ai-stepper-simple { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 10px; }
      .ai-question-row { grid-template-columns: 1fr; gap: 4px; }
      .brainstorm-option { align-items: flex-start; }

<body class="theme-b">
  <header class="demo-topbar">
    <div class="brand-lockup">
      <div class="brand-mark">溯</div>
      <div>
        <div class="brand-name">灵溯</div>
        <div class="brand-sub">研究工作台 · UI 重设计 Demo</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="tone-switch" aria-label="视觉方向">
        <button type="button" data-tone="a" aria-selected="false">A 编辑档案</button>
        <button type="button" data-tone="b" aria-selected="true">B 安静工作台</button>
        <button type="button" data-tone="c" aria-selected="false">C 业务控制台</button>
      </div>
      <a class="top-link" href="/">返回项目</a>
    </div>
  </header>

  <div class="demo-body">
    <aside class="side-panel">
      <p class="side-label" id="nav-label">学生空间</p>
      <nav class="side-nav" id="side-nav" aria-labelledby="nav-label"></nav>
    </aside>

    <main class="main-panel">
      <div class="content-limit">
        <div id="page-root"></div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var requestedRole = location.hash.slice(1);
      var initialRole = ['public', 'student', 'teacher', 'platform'].indexOf(requestedRole) >= 0 ? requestedRole : 'student';
      var state = { role: initialRole, page: 'home', tone: 'b', aiContext: 'existing', aiIntent: '', aiStep: 0, aiDirection: '', openChapter: 1 };
      var roles = {
        public: {
          label: '公共入口',
          name: '公共入口',
          items: [
            ['entry', '⌂', '品牌入口'],
            ['login', '→', '登录'],
            ['register', '+', '注册'],
            ['content', '▤', '案例与公告']
          ]
        },
        student: {
          label: '学生空间',
          name: '学生端',
          items: [
            ['home', '⌂', '首页'],
            ['projects', '▣', '我的项目'],
            ['ai', '✦', 'AI 助手'],
            ['content', '◈', '案例与赛事'],
          ],
          secondary: [
            ['journey', '◎', '研究旅程'],
            ['task', '✓', '当前任务'],
            ['materials', '▤', '材料档案'],
            ['report', '▥', '研究报告'],
            ['invitations', '♧', '项目邀请'],
            ['applications', '◇', '成果申请']
          ]
        },
        teacher: {
          label: '指导空间',
          name: '教师端',
          items: [
            ['home', '⌂', '工作台'],
            ['pool', '⌑', '项目池'],
            ['projects', '▣', '指导项目'],
            ['review', '✓', '材料审核']
          ],
          secondary: [
            ['detail', '↗', '项目详情'],
            ['members', '♙', '成员与邀请'],
            ['template', '▤', '材料范本'],
            ['content', '◈', '案例与公告']
          ]
        },
        platform: {
          label: '平台空间',
          name: '平台端',
          items: [
            ['home', '⌂', '平台概览'],
            ['schools', '▦', '学校空间'],
            ['agents', '✦', 'AI 助手模板'],
            ['content', '▤', '赛事与公告']
          ],
          secondary: [
            ['schoolDetail', '↗', '学校详情'],
            ['settings', '⚙', '系统设置']
          ]
        }
      };

      var chapters = [
        { id: 1, title: '问题提出', desc: '把兴趣变成可研究的问题', status: 'done', label: '已完成', tasks: ['兴趣观察记录', '研究问题草稿'] },
        { id: 2, title: '资料查找', desc: '找到可信的证据和来源', status: 'active', label: '进行中', tasks: ['资料来源记录', '证据摘要'] },
        { id: 3, title: '方案设计', desc: '决定如何验证你的想法', status: 'pending', label: '未开始', tasks: ['研究方案', '工具与分工'] },
        { id: 4, title: '实践验证', desc: '执行、记录并修正方案', status: 'pending', label: '未开始', tasks: ['实践记录', '结果分析'] },
        { id: 5, title: '成果表达', desc: '把过程和发现讲清楚', status: 'pending', label: '未开始', tasks: ['研究报告', '成果展示'] }
      ];

      function esc(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
        });
      }
      function status(label, kind) { return '<span class="status ' + (kind || '') + '">' + label + '</span>'; }
      function button(label, action, kind) { return '<button type="button" class="button ' + (kind || '') + '" data-action="' + action + '">' + label + '</button>'; }
      function avatar(name, color) { return '<span class="avatar ' + (color || '') + '">' + esc(name.slice(0, 1)) + '</span>'; }
      function card(content, classes) { return '<section class="card ' + (classes || '') + '">' + content + '</section>'; }
      function pageHeader(eyebrow, title, description, action) {
        return '<div class="page-header"><div><p class="eyebrow">' + eyebrow + '</p><h1>' + title + '</h1><p class="page-description">' + description + '</p></div>' + (action || '') + '</div>';
      }
      function sectionHead(title, note, action) {
        return '<div class="section-head"><div><h2>' + title + '</h2>' + (note ? '<p class="section-note">' + note + '</p>' : '') + '</div>' + (action || '') + '</div>';
      }
      function chapterCards() {
        return chapters.map(function (chapter) {
          var current = chapter.status === 'active' ? ' current' : '';
          return '<article class="card chapter-card ' + chapter.status + current + '"><div class="chapter-index">' + chapter.id + '</div><h3>' + chapter.title + '</h3><p>' + chapter.desc + '</p>' + status(chapter.label, chapter.status === 'done' ? 'done' : chapter.status === 'active' ? 'active' : 'pending') + '</article>';
        }).join('');
      }
      function chapterAccordion() {
        return chapters.map(function (chapter) {
          var open = state.openChapter === chapter.id ? ' open' : '';
          return '<div class="accordion-row ' + chapter.status + open + '"><button class="accordion-head" type="button" data-action="toggle-chapter" data-chapter="' + chapter.id + '"><span class="accordion-number">' + chapter.id + '</span><span class="accordion-title">' + chapter.title + '</span><span class="accordion-meta">' + chapter.tasks.length + ' 项任务 · ' + chapter.label + '</span><span class="accordion-chevron">⌄</span></button><div class="accordion-body">' + chapter.tasks.map(function (task, index) { return '<div class="task-mini"><span>' + task + '</span>' + status(index === 0 && chapter.status === 'done' ? '已提交' : chapter.status === 'active' && index === 0 ? '待完成' : '未开始', index === 0 && chapter.status === 'done' ? 'done' : chapter.status === 'active' && index === 0 ? 'active' : 'pending') + '</div>'; }).join('') + '</div></div>';
        }).join('');
      }

      function renderNav() {
        var role = roles[state.role];
        document.getElementById('nav-label').textContent = role.label;
        document.querySelectorAll('[data-role]').forEach(function (node) { node.setAttribute('aria-selected', node.getAttribute('data-role') === state.role ? 'true' : 'false'); });
        var primary = role.items.map(function (item) {
          return '<button type="button" class="nav-item" data-page="' + item[0] + '" aria-current="' + (item[0] === state.page ? 'page' : 'false') + '"><span class="nav-icon">' + item[1] + '</span><span>' + item[2] + '</span></button>';
        }).join('');
        var secondary = (role.secondary || []).map(function (item) {
          return '<button type="button" class="nav-item nav-item-secondary" data-page="' + item[0] + '" aria-current="' + (item[0] === state.page ? 'page' : 'false') + '"><span class="nav-icon">' + item[1] + '</span><span>' + item[2] + '</span></button>';
        }).join('');
        document.getElementById('side-nav').innerHTML = primary + (secondary ? '<div class="nav-more-label">更多页面</div>' + secondary : '');
      }

      function studentHome() {
        return pageHeader('今天', '先把一个问题说清楚。', '研究不是一次完成的答案，而是从一个好问题开始。这里会告诉你今天最重要的下一步。', button('打开研究旅程 →', 'page:journey', 'primary')) +
          '<div class="hero-grid"><section class="card hero-card"><p class="eyebrow" style="color:rgba(255,255,255,.65)">当前项目 · 城市雨水回收研究</p><h2>你已经完成了问题提出，接下来去找证据。</h2><p>把观察到的现象变成可信的资料来源，今天只需要完成一项小任务。</p><div class="hero-meta"><span>进行中 · 第 2 章 / 共 5 章</span><span>预计用时 20 分钟</span></div></section><section class="card next-card"><div class="task-kicker"><span>今天的主要任务</span>' + status('待完成', 'active') + '</div><div class="task-title">完成资料来源记录</div><div class="task-text">记录你找到的资料，以及它为什么值得相信。</div><div class="progress-row"><span>章节进度</span><strong>1 / 2</strong></div><div class="progress-track"><div class="progress-value" style="width:50%"></div></div><div style="margin-top:20px">' + button('开始任务 →', 'page:task', 'primary') + '</div></section></div>' +
          sectionHead('我的项目', '只展示最需要你关注的信息', button('打开项目 →', 'page:projects', 'subtle')) +
          '<div class="chapter-grid">' + chapterCards() + '</div>' +
          '<div class="two-col">' + card('<div class="section-head" style="margin-top:0"><div><h2>最近材料</h2><p class="section-note">按研究章节自动归档</p></div>' + button('查看全部', 'page:materials', 'subtle') + '</div><div class="list"><div class="list-row"><div class="row-main"><div class="row-title">研究问题草稿</div><div class="row-meta">问题提出 · 昨天更新</div></div>' + status('已提交', 'done') + '</div><div class="list-row"><div class="row-main"><div class="row-title">资料来源记录</div><div class="row-meta">资料查找 · 还差 1 项</div></div>' + status('进行中', 'active') + '</div></div>', 'card-pad') + card('<h2>研究小提醒</h2><div class="callout"><strong>先问“为什么”，再急着找答案。</strong>一个清晰的问题，比一堆没有方向的资料更有价值。</div><div style="margin-top:16px">' + button('请 AI 帮我想一想', 'page:ai', 'subtle') + '</div>', 'card-pad') + '</div>';
      }
      function studentProjects() {
        return pageHeader('项目', '我的项目', '一个项目就是一条研究旅程。进入项目后，只保留与你当前阶段有关的信息。', button('+ 新建项目', 'toast:新建项目流程将在确认后接入', 'primary')) +

          '<div class="metric-grid"><div class="card metric"><div class="metric-label">活跃项目</div><div class="metric-value">24</div><div class="metric-foot">过去 7 天 +3</div></div><div class="card metric"><div class="metric-label">学生</div><div class="metric-value">86</div><div class="metric-foot">已授权账号</div></div><div class="card metric"><div class="metric-label">指导教师</div><div class="metric-value">12</div><div class="metric-foot">本学期活跃</div></div><div class="card metric"><div class="metric-label">空间状态</div><div class="metric-value" style="font-size:20px">已启用</div><div class="metric-foot good">服务正常</div></div></div><div class="two-col" style="margin-top:var(--space-7)">' + card('<h2>学校信息</h2><div class="list"><div class="list-row"><span>联系人</span><strong>周老师</strong></div><div class="list-row"><span>邀请码</span><span class="chip">HS-2026-24</span></div><div class="list-row"><span>创建时间</span><span class="muted">2026 年 3 月 18 日</span></div></div>', 'card-pad') + card('<h2>空间操作</h2><p class="muted">授权开关只影响访问，不会删除学校数据或项目内容。</p><div class="stack" style="margin-top:16px">' + button('管理授权', 'toast:授权设置已打开', 'primary') + button('查看操作记录', 'toast:操作记录已打开', 'subtle') + '</div>', 'card-pad') + '</div>';
      }
      function platformAgents() {
        return pageHeader('AI 助手模板', 'AI 助手模板', '只管理模板的名称、角色、分组和启用状态；使用流程由学生端的任务入口承载。', button('+ 新建模板', 'toast:打开新建模板流程', 'primary')) +
          card('<div class="filter-bar"><input class="input" placeholder="搜索模板名称" aria-label="搜索模板名称" /><select class="select"><option>全部角色</option><option>学生</option><option>教师</option></select><select class="select"><option>全部分组</option><option>选题</option><option>任务</option><option>指导</option></select><select class="select"><option>全部状态</option><option>已启用</option><option>已停用</option></select></div><div class="table-wrap"><table><thead><tr><th>模板名称</th><th>角色</th><th>分组</th><th>最近更新</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td><div class="row-title">研究问题助手</div><div class="row-meta">帮助学生从兴趣形成问题</div></td><td>学生</td><td><span class="chip">选题</span></td><td>今天 09:20</td><td>' + status('已启用', 'done') + '</td><td>' + button('编辑', 'toast:打开模板编辑', 'subtle') + '</td></tr><tr><td><div class="row-title">任务拆解助手</div><div class="row-meta">围绕当前任务给出下一步建议</div></td><td>学生</td><td><span class="chip">任务</span></td><td>昨天 15:14</td><td>' + status('已启用', 'done') + '</td><td>' + button('编辑', 'toast:打开模板编辑', 'subtle') + '</td></tr><tr><td><div class="row-title">材料审核助手</div><div class="row-meta">辅助教师检查材料完整性</div></td><td>教师</td><td><span class="chip">指导</span></td><td>8 月 18 日</td><td>' + status('已停用', 'pending') + '</td><td>' + button('编辑', 'toast:打开模板编辑', 'subtle') + '</td></tr></tbody></table></div>', 'card-pad');
      }
      function platformContent() {
        return pageHeader('运营内容', '赛事与公告', '内容页面沿用同一套卡片和筛选结构，运营操作保持清晰的主次关系。', button('+ 发布内容', 'toast:打开发布内容流程', 'primary')) +
          '<div class="filter-bar"><input class="input" placeholder="搜索标题" aria-label="搜索标题" /><select class="select"><option>全部类型</option><option>赛事</option><option>公告</option><option>案例</option></select><button class="button">筛选</button></div><div class="three-col"><article class="card card-pad"><p class="eyebrow">赛事</p><h3>2026 青少年科创挑战赛</h3><p class="muted">报名截止：9 月 30 日</p><div style="margin-top:18px">' + status('已发布', 'done') + '</div></article><article class="card card-pad"><p class="eyebrow">公告</p><h3>秋季研究旅程开放通知</h3><p class="muted">面向全部已授权学校</p><div style="margin-top:18px">' + status('已发布', 'done') + '</div></article><article class="card card-pad"><p class="eyebrow">案例</p><h3>校园雨水花园的观察记录</h3><p class="muted">可作为学生研究参考</p><div style="margin-top:18px">' + status('草稿', 'pending') + '</div></article></div>';
      }
      function platformSettings() {
        return pageHeader('设置', '系统设置', '低频配置集中在这里，避免与平台日常运营入口重复。', '') +
          '<div class="two-col"><div class="stack">' + card('<h2>安全策略</h2><div class="list"><div class="list-row"><div class="row-main"><div class="row-title">新学校默认授权</div><div class="row-meta">新建学校后需要管理员手动启用</div></div><span class="chip">关闭</span></div><div class="list-row"><div class="row-main"><div class="row-title">学生公开成果申请</div><div class="row-meta">需要教师审核后进入平台展示</div></div><span class="chip">需审核</span></div></div>', 'card-pad') + card('<h2>服务健康</h2><div class="list"><div class="list-row"><span>API 服务</span>' + status('正常', 'done') + '</div><div class="list-row"><span>AI 服务</span>' + status('正常', 'done') + '</div><div class="list-row"><span>文件服务</span>' + status('正常', 'done') + '</div></div>', 'card-pad') + '</div><aside>' + card('<h2>修改原则</h2><p class="muted">设置只影响平台策略，不直接改变学生和教师的业务流程。</p>' + button('查看操作记录', 'toast:操作记录入口', 'subtle'), 'card-pad') + '</aside></div>';
      }

      function pageContent() {
        if (state.role === 'public') {
          return { entry: publicEntry, login: publicLogin, register: publicRegister, content: publicContent }[state.page]();
        }
        if (state.role === 'student') {
          return { home: studentHome, projects: studentProjects, journey: studentJourney, task: studentTask, materials: studentMaterials, report: studentReport, ai: studentAI, content: studentContent, invitations: studentInvitations, applications: studentApplications }[state.page]();
        }
        if (state.role === 'teacher') {
          return { home: teacherHome, pool: teacherPool, projects: teacherProjects, detail: teacherDetail, review: teacherReview, aiReview: teacherAIReview, members: teacherMembers, template: teacherTemplate, content: teacherContent }[state.page]();
        }
        return { home: platformHome, schools: platformSchools, schoolDetail: platformSchoolDetail, agents: platformAgents, content: platformContent, settings: platformSettings }[state.page]();
      }

      function render() {
        document.body.className = 'theme-' + state.tone;
        document.querySelectorAll('[data-tone]').forEach(function (node) { node.setAttribute('aria-selected', node.getAttribute('data-tone') === state.tone ? 'true' : 'false'); });
        renderNav();
        document.getElementById('page-root').innerHTML = pageContent();
      }
      function toast(message) {
        var node = document.getElementById('toast');
        node.textContent = message;
        node.classList.add('show');
        window.clearTimeout(window.__demoToast);
        window.__demoToast = window.setTimeout(function () { node.classList.remove('show'); }, 2600);
      }
      function chooseRole(role) {
        state.role = role;
        state.page = role === 'public' ? 'entry' : 'home';
        state.aiContext = 'existing';
        state.aiIntent = '';
        state.aiStep = 0;
        state.aiDirection = '';
        render();
      }
      function choosePage(page) {
        state.page = page;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      document.addEventListener('click', function (event) {
        var target = event.target.closest('[data-role], [data-tone], [data-page], [data-action]');
        if (!target) return;
        if (target.hasAttribute('data-role')) { chooseRole(target.getAttribute('data-role')); return; }
        if (target.hasAttribute('data-tone')) { state.tone = target.getAttribute('data-tone'); render(); return; }
        if (target.hasAttribute('data-page')) { choosePage(target.getAttribute('data-page')); return; }
        var action = target.getAttribute('data-action') || '';
        if (action.indexOf('page:') === 0) { choosePage(action.slice(5)); return; }
        if (action.indexOf('toast:') === 0) { toast(action.slice(6)); return; }
        if (action === 'creation:brainstorm') { state.aiContext = 'no-project'; state.aiIntent = 'topic'; state.aiStep = 0; state.aiDirection = ''; choosePage('ai'); return; }
        if (action === 'ai:context') { state.aiContext = target.getAttribute('data-context') === 'no-project' ? 'no-project' : 'existing'; state.aiIntent = state.aiContext === 'no-project' ? 'topic' : ''; state.aiStep = 0; state.aiDirection = ''; render(); return; }
        if (action === 'toggle-chapter') { state.openChapter = Number(target.getAttribute('data-chapter')); render(); return; }
        if (action === 'ai:choose') { state.aiIntent = target.getAttribute('data-intent'); state.aiStep = 0; state.aiDirection = ''; render(); return; }
        if (action === 'ai:choose-direction') { state.aiDirection = target.getAttribute('data-direction') || ''; render(); return; }
        if (action === 'ai:advance') { if (state.aiContext === 'no-project' && state.aiStep === 2 && !state.aiDirection) { toast('先选择一个你愿意继续观察的方向'); return; } state.aiStep = Math.min(3, state.aiStep + 1); render(); return; }
        if (action === 'ai:commit') { state.aiStep = 4; toast(state.aiContext === 'no-project' ? '项目草稿已确认，下一步可以进入研究旅程' : '建议已保存到当前项目草稿'); render(); return; }
        if (action === 'ai:reset') { state.aiStep = 0; state.aiDirection = ''; render(); return; }
      });
      render();
    }());
  </script>
